name: Live read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    environment: trader-api-read-only
    env:
      TRADER_API_KEY: ${{ secrets.TRADER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Create non-secret environment config
        shell: pwsh
        env:
          WEB_PROXY_URL: ${{ vars.WEB_PROXY_URL }}
          FXSERVER_REST_URL: ${{ vars.FXSERVER_REST_URL }}
          CHART_SERVER_URL: ${{ vars.CHART_SERVER_URL }}
          CONTRACT: ${{ vars.CONTRACT }}
        run: |
          @"
          environment: demo
          endpoints:
            web_proxy_url: $env:WEB_PROXY_URL
            fxserver_rest_url: $env:FXSERVER_REST_URL
            chart_server_url: $env:CHART_SERVER_URL
          trading:
            contract: $env:CONTRACT
            amount: 1
            max_runtime_seconds: 60
            poll_seconds: 5
            bar_count: 200
          strategy:
            period_type: 1
            rsi_period: 14
            oversold: 30
            overbought: 70
            exit_level: 50
          "@ | Set-Content -LiteralPath config.live.yaml
      - run: trader-api-examples account-inspector --config config.live.yaml --output json
      - run: trader-api-examples market-data-monitor --config config.live.yaml --bars-only --output json
