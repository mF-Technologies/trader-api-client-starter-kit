  verified: ["3.12"]
operating_systems:
  verified: ["Windows 11"]
  best_effort: ["Linux", "macOS"]
dependencies:
  TA-Lib: 0.7.1
  fxserverclientpython: 0.1.10
upstream_contracts:
  developer_platform:
    repository: https://github.com/mF-Technologies/Developers-Platform
    commit: 435d067243a3f5a40e643fe7ac89cda416b3cce0 # pragma: allowlist secret
    paths:
      - openapi/webproxy.yml
      - openapi/fxserver-trader.yaml
      - openapi/realtime-chart-server.yml
  qa_reference:
    repository: https://gitlab.internal.mfcloud.net/automation-util/mf_openapi
    commit: cacf7f57fc03905915511b58c949e9bdacfe6c9c # pragma: allowlist secret
    paths:
      - docs/specs/algo-capability-test.md
      - docs/reports/algo-capability-test-findings.md
